name: BankOns
description: BankOns was a San Mateo, California mobile savings startup founded in the summer of 2010 by Joshua
  Greenough, a former VP of Operations at PowerReviews. Launched in May 2011, the app connected a user's bank
  transaction history to their location, analyzing spending habits to surface the nearby merchant deals and rewards
  best suited to them, drawing on Foursquare and other local deals data. The name was a contraction of "bank"
  and "coupons". BankOns was seed funded by 500 Startups (now 500 Global) plus a friends-and-family round. In
  May 2012 Capital One acquired select BankOns software through a limited asset purchase agreement, and several
  team members including Greenough joined Capital One Labs. The product was wound down and the company no longer
  operates a consumer service or a developer platform. The bankons.com domain resolves to a GoDaddy parking lander
  with no content, and no API, documentation, SDK, or developer surface exists.
